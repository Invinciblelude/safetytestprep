<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TikTok authorization — Safety Test Prep</title>
  <style>
    body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #1c2430; line-height: 1.5; }
    code { background: #f0efe9; padding: .15rem .4rem; border-radius: 3px; font-size: .95rem; word-break: break-all; }
    .box { border: 1px solid #d9d6ce; padding: 1rem 1.25rem; margin-top: 1rem; }
    button { font: inherit; padding: .4rem .8rem; }
    .muted { color: #6e7783; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>TikTok authorization</h1>
  <p class="muted">This page is for the site owner. It is not linked from anywhere and is not indexed.</p>
  <div id="out" class="box">Reading the response from TikTok…</div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var code = q.get("code"), err = q.get("error"), desc = q.get("error_description"), state = q.get("state");
      var out = document.getElementById("out");
      if (err) {
        out.innerHTML = "<p><strong>TikTok returned an error:</strong> <code>" + err + "</code></p><p>" + (desc || "") + "</p>";
        return;
      }
      if (!code) {
        out.innerHTML = "<p>No authorization code in the address. Start the authorization from the poster on your computer, which sends you to TikTok and back here.</p>";
        return;
      }
      out.innerHTML =
        "<p><strong>Authorized.</strong> One step left, on your computer:</p>" +
        "<ol><li>Copy this code: <code id='c'></code> <button type='button' id='b'>Copy</button></li>" +
        "<li>Paste it into <code>voice-council/.env.local</code> as <code>TIKTOK_AUTH_CODE=…</code> and save.</li>" +
        "<li>Tell the room. The poster exchanges it for tokens within minutes. The code expires quickly, so do this now.</li></ol>" +
        (state ? "<p class='muted'>State: <code>" + state + "</code></p>" : "");
      document.getElementById("c").textContent = code;
      document.getElementById("b").onclick = function () {
        navigator.clipboard.writeText(code).then(function () { document.getElementById("b").textContent = "Copied"; });
      };
    })();
  </script>
</body>
</html>
